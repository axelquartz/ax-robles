<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>forms</title></head>
<body>
<form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contacto" />
  <input type="hidden" name="subject" value="Nuevo contacto en axrobles.com" />
  <input name="bot-field" />
  <input name="nombre" type="text" />
  <input name="contacto" type="text" />
  <input name="giro" type="text" />
  <input name="necesito" type="text" />
  <textarea name="detalle"></textarea>
</form>
</body>
</html>
